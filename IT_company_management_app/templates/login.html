<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In · NexusCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            color: #1e293b;
            line-height: 1.5;
            min-height: 100vh;
            background-image: 
                linear-gradient(135deg, rgba(247, 249, 252, 0.94) 0%, rgba(230, 238, 250, 0.9) 100%),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ---------- MAIN CARD ---------- */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2.8rem 2.5rem 2.5rem;
            box-shadow: 0 40px 70px -25px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* ---------- HEADER ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 1.8rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.35);
        }

        .logo-text span {
            color: #2563eb;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.98rem;
        }

        /* ---------- FORM ---------- */
        .login-form {
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            transition: border 0.2s, box-shadow 0.2s;
            color: #1e293b;
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .form-control:focus + i,
        .input-icon:focus-within i {
            color: #2563eb;
        }

        /* ---------- FORM OPTIONS (Remember me only) ---------- */
        .form-options {
            display: flex;
            align-items: center;
            margin: 0.5rem 0 1.8rem;
            font-size: 0.87rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: #475569;
            cursor: pointer;
            font-weight: 500;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        /* ---------- BUTTONS ---------- */
        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 12px 22px -10px rgba(37, 99, 235, 0.5);
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 18px 28px -12px rgba(37, 99, 235, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* ---------- SIGNUP LINK ---------- */
        .signup-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.92rem;
            color: #64748b;
        }

        .signup-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* ---------- SECURITY NOTICE ---------- */
        .security-notice {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #075985;
            line-height: 1.55;
        }

        .security-notice i {
            color: #0284c7;
            font-size: 1.1rem;
            margin-top: 0.1rem;
            flex-shrink: 0;
        }

        .security-notice strong {
            font-weight: 600;
            color: #0c4a6e;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            .login-card {
                padding: 2rem 1.4rem 1.8rem;
                border-radius: 24px;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }

            .logo-area {
                font-size: 1.4rem;
            }

            .security-notice {
                font-size: 0.8rem;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-cubes"></i>
                </div>
                <div class="logo-text">Nexus<span>Core</span></div>
            </div>
            <h1>Welcome back</h1>
            <p>Log in to your NexusCore account to continue.</p>
        </div>

        <!-- Login Form -->
        <form class="login-form" action="#" method="post">
           {% csrf_token %}
            <!-- Username / Email -->
            <div class="form-group">
                <label for="username_email">
                    <i class="fas fa-user" style="color:#2563eb; font-size:0.8rem;"></i> Username 
                </label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text"  name="username" class="form-control" placeholder="username " required autofocus>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock" style="color:#2563eb; font-size:0.8rem;"></i> Password
                </label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Options: Remember me only (forgot password removed) -->
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-arrow-right-to-bracket"></i> Log in
            </button>

        </form>

        <!-- Signup link -->
        <div class="signup-link">
            Don't have an account? <a href="{%url 'register'%}">Create one</a>
        </div>

        <!-- Security notice -->
        <div class="security-notice">
            <i class="fas fa-shield-alt"></i>
            <div>
                <strong>Security tip:</strong> Never share your password. NexusCore will never ask for your credentials via email or phone.
            </div>
        </div>
    </div>

</body>
</html>
