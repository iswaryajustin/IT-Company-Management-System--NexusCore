<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · NexusCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
            min-height: 100vh;
            background-image: 
                linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(30, 41, 59, 0.92) 100%),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ---------- MAIN CARD ---------- */
        .admin-login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 2.8rem 2.5rem 2.5rem;
            box-shadow: 0 40px 70px -25px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ---------- HEADER ---------- */
        .admin-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        /* ---- Logo styled like the landing page, on a light pill for dark background ---- */
        .logo-area {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 1.8rem;
            padding: 0.6rem 1.3rem;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .logo-icon {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.3);
            flex-shrink: 0;
        }

        .logo-text {
            color: #0f172a;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .logo-text span {
            color: #2563eb;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.35rem 1rem;
            border-radius: 100px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .admin-badge i {
            font-size: 0.7rem;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }

        .admin-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* ---------- FORM ---------- */
        .admin-form {
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.7rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(15, 23, 42, 0.6);
            transition: border 0.2s, box-shadow 0.2s, background 0.2s;
            color: #f1f5f9;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .form-control:focus + i,
        .input-icon:focus-within i {
            color: #60a5fa;
        }

        /* ---------- FORM OPTIONS ---------- */
        .form-options {
            display: flex;
            align-items: center;
            margin: 0.5rem 0 1.8rem;
            font-size: 0.87rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 500;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        /* ---------- BUTTONS ---------- */
        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 12px 24px -10px rgba(37, 99, 235, 0.6);
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 18px 30px -12px rgba(37, 99, 235, 0.7);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* ---------- SECURITY NOTICE ---------- */
        .security-notice {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-top: 1.8rem;
            font-size: 0.82rem;
            color: #fca5a5;
            line-height: 1.55;
        }

        .security-notice i {
            color: #ef4444;
            font-size: 1rem;
            margin-top: 0.1rem;
            flex-shrink: 0;
        }

        .security-notice strong {
            font-weight: 600;
            color: #fecaca;
        }

        /* ---------- FOOTER LINK ---------- */
        .back-link {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .back-link a {
            color: #60a5fa;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            .admin-login-card {
                padding: 2rem 1.4rem 1.8rem;
                border-radius: 24px;
            }

            .admin-header h1 {
                font-size: 1.5rem;
            }

            .logo-area {
                font-size: 1.4rem;
                padding: 0.5rem 1rem;
                gap: 0.5rem;
            }

            .logo-text {
                font-size: 1.4rem;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
                border-radius: 9px;
            }

            .security-notice {
                font-size: 0.78rem;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <!-- Header -->
        <div class="admin-header">
            <!-- Logo now matches landing page style: blue icon + dark text, on white pill -->
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-cubes"></i>
                </div>
                <div class="logo-text">Nexus<span>Core</span></div>
            </div>
            <div class="admin-badge">
                <i class="fas fa-lock"></i> Restricted Access
            </div>
            <h1>Admin Portal</h1>
            <p>Authorized personnel only. Please verify your credentials.</p>
        </div>

        <!-- Admin Login Form -->
        <form class="admin-form" action="#" method="post">
          {% csrf_token %} 
            <!-- Admin ID / Email -->
            <div class="form-group">
                <label for="admin_id">
                    <i class="fas fa-user-shield" style="color:#ef4444; font-size:0.8rem;"></i> Admin Name
                </label>
                <div class="input-icon">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock" style="color:#ef4444; font-size:0.8rem;"></i> Password
                </label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
                </div>
            </div>

            <!-- Remember me -->
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    Keep me signed in on this device
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-arrow-right-to-bracket"></i> Access Admin Dashboard
            </button>

        </form>

        <!-- Security notice -->
        <div class="security-notice">
            <i class="fas fa-triangle-exclamation"></i>
            <div>
                <strong>Warning:</strong> All admin login attempts are logged and monitored. Unauthorized access is strictly prohibited and may be prosecuted.
            </div>
        </div>

        <!-- Back link -->
        <div class="back-link">
            <a href="{%url 'landing' %}"><i class="fas fa-arrow-left" style="margin-right:4px;"></i> Back to main site</a>
        </div>
    </div>

</body>
</html>
