<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} · NexusCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            line-height: 1.5;
            min-height: 100vh;
            background-image:
                linear-gradient(135deg, rgba(241, 245, 249, 0.94) 0%, rgba(226, 232, 240, 0.9) 100%),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* ========== TOP BAR ========== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.1rem 2rem;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 16px -8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .brand-icon {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.35);
        }

        .brand-text span {
            color: #2563eb;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.18s;
            position: relative;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        .icon-btn .dot {
            position: absolute;
            top: 9px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #f8fafc;
        }

        .admin-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.4rem 0.85rem 0.4rem 0.45rem;
            text-decoration: none;
            transition: all 0.18s;
        }

        .admin-chip:hover {
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .admin-avatar {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.78rem;
            flex-shrink: 0;
        }

        .admin-chip-info {
            line-height: 1.2;
        }

        .admin-chip-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #0f172a;
        }

        .admin-chip-role {
            font-size: 0.68rem;
            color: #64748b;
            font-weight: 500;
        }

        .btn-logout-top {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .btn-logout-top:hover {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
            box-shadow: 0 8px 16px -8px rgba(220, 38, 38, 0.6);
            transform: translateY(-1px);
        }

        /* ========== MAIN ========== */
        .main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        /* Page header */
        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 0.3rem;
        }

        .page-header p {
            font-size: 0.95rem;
            color: #64748b;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* ========== FORM CARD ========== */
        .form-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-radius: 26px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 24px 50px -22px rgba(0, 0, 0, 0.22);
            padding: 2.2rem 2rem;
            max-width: 720px;
        }

        .form-card-header {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 1.75rem;
        }

        .form-card-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #eef2ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            flex-shrink: 0;
        }

        .form-card-header-info h2 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .form-card-header-info p {
            font-size: 0.83rem;
            color: #64748b;
            margin-top: 0.15rem;
        }

        /* Django form.as_p overrides */
        .form-card form p {
            margin-bottom: 1.35rem;
        }

        .form-card form p label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.45rem;
        }

        .form-card form p input,
        .form-card form p select,
        .form-card form p textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 13px;
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            transition: border 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-card form p input:focus,
        .form-card form p select:focus,
        .form-card form p textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-card form p textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-card form p input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        .form-card form p select[multiple] {
            min-height: 120px;
            padding: 0.6rem;
            background-image: none;
        }

        /* Help text */
        .form-card form p .helptext {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 0.35rem;
            line-height: 1.5;
        }

        /* Error messages */
        .form-card form p .errorlist {
            list-style: none;
            margin-top: 0.4rem;
            padding: 0.6rem 0.85rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #dc2626;
        }

        .form-card form p .errorlist li {
            display: flex;
            align-items: flex-start;
            gap: 0.35rem;
        }

        .form-card form p .errorlist li::before {
            content: "⚠";
            flex-shrink: 0;
        }

        /* Actions */
        .form-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.78rem 1.6rem;
            border-radius: 13px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(37, 99, 235, 0.6);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 26px -12px rgba(37, 99, 235, 0.7);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 560px) {
            .topbar {
                padding: 0.9rem 1rem;
            }

            .brand {
                font-size: 1.1rem;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
                font-size: 1.05rem;
            }

            .admin-chip-info {
                display: none;
            }

            .btn-logout-top span {
                display: none;
            }

            .btn-logout-top {
                padding: 0.6rem 0.75rem;
            }

            .main {
                padding: 2rem 1rem 3rem;
            }

            .page-header h1 {
                font-size: 1.4rem;
            }

            .form-card {
                padding: 1.6rem 1.2rem;
                border-radius: 22px;
            }

            .form-card-header {
                flex-direction: column;
                text-align: center;
                gap: 0.85rem;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ========== TOP BAR ========== -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-cubes"></i>
            </div>
            <div class="brand-text">Nexus<span>Core</span></div>
        </div>

        <div class="topbar-actions">

            <a href="#" class="icon-btn" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot"></span>
            </a>

            <a href="#" class="admin-chip">
                <div class="admin-avatar">AD</div>
                <div class="admin-chip-info">
                    <div class="admin-chip-name">Admin User</div>
                    <div class="admin-chip-role">Super Admin</div>
                </div>
            </a>

            <a href="{% url 'login' %}" class="btn-logout-top">
                <i class="fas fa-right-from-bracket"></i> <span>Logout</span>
            </a>

        </div>

    </header>

    <!-- ========== MAIN ========== -->
    <main class="main">

        <!-- Page header -->
        <div class="page-header">
            <h1>{{ page_title }}</h1>
            <p>Fill in the project details below.</p>
        </div>

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="{% url 'manage_projects' %}">
                <i class="fas fa-arrow-left"></i> Back to Manage Projects
            </a>
        </div>

        <!-- ========== FORM CARD ========== -->
        <div class="form-card">

            <div class="form-card-header">
                <div class="form-card-icon">
                    <i class="fas fa-folder-plus"></i>
                </div>
                <div class="form-card-header-info">
                    <h2>{{ page_title }}</h2>
                    <p>Provide the project information and assign team members.</p>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-floppy-disk"></i> Save Project
                    </button>
                    <a href="{% url 'manage_projects' %}" class="btn btn-secondary">
                        <i class="fas fa-xmark"></i> Cancel
                    </a>
                </div>
            </form>

        </div>

    </main>

</body>

</html>
